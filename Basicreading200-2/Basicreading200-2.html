<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Basic Reading 200 Key Words 2 · 音频播放</title>
<style>
  :root{
    --bg1:#fef6ff; --bg2:#eef6ff; --bg3:#f3fff6;
    --card:#ffffff; --ink:#2b2f44; --sub:#7a8098;
    --accent:#ff7eb6; --accent2:#7c5cff; --accent3:#22c1a4;
    --chip:#fff0f7; --chip-on:#ff7eb6; --line:#eceffb;
    --shadow:0 10px 30px rgba(70,80,140,.12);
    --cols:4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, var(--bg1), transparent 60%),
      radial-gradient(1000px 500px at 110% 0%, var(--bg2), transparent 55%),
      linear-gradient(180deg, var(--bg3), #ffffff 60%);
    min-height:100vh;
    padding:22px 16px 150px;
  }
  .wrap{max-width:1180px;margin:0 auto;}
  header.top{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    margin-bottom:14px;
  }
  .logo{
    width:54px;height:54px;border-radius:18px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-size:28px;
    box-shadow:var(--shadow);
  }
  h1{font-size:clamp(20px,4.5vw,30px);margin:0;font-weight:800;letter-spacing:.5px;}
  .sub{color:var(--sub);font-size:13px;margin-top:2px;}
  .back{
    flex:0 0 auto;display:flex;align-items:center;gap:4px;text-decoration:none;
    color:#c23b7e;background:#fff;border:1.5px solid var(--line);border-radius:999px;
    padding:10px 15px;font-size:13px;font-weight:800;transition:border-color .15s ease;
  }
  .back:hover{border-color:var(--accent2);}
  .tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .search{
    border:1.5px solid var(--line);background:#fff;border-radius:999px;
    padding:10px 16px;font-size:14px;width:min(46vw,260px);outline:none;color:var(--ink);
  }
  .search:focus{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(124,92,255,.12);}
  .count{font-size:13px;color:var(--sub);}

  /* ---------- 4 列网格：封面一 · 封面二 · P2 · P3 … ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(var(--cols), minmax(0,1fr));
    gap:18px;
    justify-items:center;
    align-items:start;
  }
  .page{
    background:var(--card);border-radius:20px;padding:10px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;
    border-top:3px solid transparent;width:100%;
    max-width:clamp(150px, calc((100vh - 300px) * .70), 340px);
    transition:transform .15s ease,box-shadow .2s ease,background .2s ease;
  }
  .page:active{transform:scale(.99);}
  .page.playing{
    background:linear-gradient(180deg,#fff5fa,#ffffff 70%);
    border-top-color:var(--accent);
    box-shadow:0 14px 36px rgba(255,126,182,.28);
  }
  @media (max-width:1100px){ .grid{--cols:4; gap:14px;} }
  @media (max-width:860px){  .grid{--cols:3; gap:14px;} }
  @media (max-width:620px){  .grid{--cols:2; gap:12px;} .page{padding:8px;gap:7px;} }
  @media (max-height:600px){
    body{padding-top:10px;padding-bottom:120px;}
    header.top{margin-bottom:8px;gap:8px;}
    .logo{width:36px;height:36px;font-size:20px;border-radius:12px;}
    h1{font-size:16px;} .sub{display:inline;}
    .search{width:min(30vw,140px);padding:7px 12px;font-size:13px;}
    .page{max-width:clamp(140px, calc((100vh - 150px) * .70), 340px);}
  }

  /* 顶部环境警告条 */
  .warn{
    background:linear-gradient(135deg,#fff4e5,#ffe9ef);
    border:1.5px solid #ffd0a8;border-radius:18px;padding:14px 16px;margin-bottom:16px;
    font-size:13px;line-height:1.6;
  }
  .warn b{color:#b45309;}
  .warnurl{font-family:ui-monospace,Consolas,monospace;background:#fff;border-radius:8px;padding:2px 6px;font-size:12px;word-break:break-all;}
  .copybtn{border:none;border-radius:10px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;margin-top:8px;}
  .thumb{
    width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#f4f6fb;
    cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;
  }
  .thumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .badge{
    position:absolute;top:8px;left:8px;
    background:linear-gradient(135deg,#7c5cff,#ff7eb6);color:#fff;
    font-size:14px;font-weight:800;padding:5px 13px;border-radius:999px;
    letter-spacing:.5px;box-shadow:0 4px 12px rgba(124,92,255,.35);
  }
  .wave{position:absolute;bottom:8px;right:8px;display:none;gap:3px;align-items:flex-end;height:20px;}
  .page.playing .wave{display:flex;}
  .wave i{width:3px;background:var(--accent);border-radius:3px;animation:w 1s infinite ease-in-out;}
  .wave i:nth-child(2){animation-delay:.2s}.wave i:nth-child(3){animation-delay:.4s}.wave i:nth-child(4){animation-delay:.6s}
  @keyframes w{0%,100%{height:5px}50%{height:18px}}
  .fname{font-size:13px;font-weight:700;line-height:1.35;color:var(--ink);word-break:break-word;}
  .fname .ext{color:var(--sub);font-weight:600;}
  /* ---------- 音频区：统一上下 2 排，每格都有背景 ---------- */
  .tracks{
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));  /* 2 列 */
    grid-template-rows:repeat(2, 40px);              /* 固定两排 → 所有卡片底部等高 */
    grid-auto-rows:40px;                             /* 超过 4 条时后续排同样高度 */
    gap:6px;
    padding:7px;                                     /* 整块底板背景 */
    background:#f5f7fd;
    border:1px solid var(--line);
    border-radius:16px;
  }
  .track{
    border:1px solid #ffe3f0;cursor:pointer;border-radius:11px;
    background:var(--chip);color:#c23b7e;font-weight:800;font-size:14px;
    padding:0;display:flex;align-items:center;justify-content:center;gap:5px;
    transition:background .15s ease,color .15s ease,transform .1s ease;
  }
  /* 只有 1 个音轨时：粉色背景填满整个两排区域 */
  .track.wide{grid-column:1 / -1;grid-row:1 / -1;font-size:17px;}
  .track:hover{background:#ffe0ef;}
  .track:active{transform:scale(.94);}
  .track.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(255,126,182,.4);}
  .track .ic{font-size:12px;}
  /* 暂无音频：同样给一块背景，占满 2 排，高度与其他卡片一致 */
  .track.ghost{
    grid-column:1 / -1;grid-row:1 / -1;
    background:#eef0f7;border:1px dashed #dde1ef;color:#9aa0b5;
    font-size:12px;font-weight:700;cursor:default;
  }
  .track.ghost:active{transform:none;}
  .noaudio{font-size:12px;color:var(--sub);background:#f4f6fb;border-radius:12px;padding:9px 0;text-align:center;font-weight:700;}
  .togglebtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-size:14px;cursor:pointer;color:var(--ink);font-weight:700;transition:all .15s ease;}
  .togglebtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(255,126,182,.35);}

  /* now playing dock */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:flex;align-items:center;gap:14px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.82);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(70,80,140,.14);
  }
  .dock .dthumb{width:50px;height:50px;border-radius:14px;background:#f4f6fb;flex:0 0 auto;overflow:hidden;display:none;}
  .dock .dthumb.show{display:block;}
  .dock .dthumb img{width:100%;height:100%;object-fit:contain;}
  .dbtn{
    width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:22px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px rgba(124,92,255,.4);
    transition:transform .1s ease;
  }
  .dbtn:active{transform:scale(.92);}
  .dinfo{flex:1 1 auto;min-width:0;}
  .dtitle{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dtrack{font-size:12px;color:var(--sub);margin-top:1px;}
  .bar{flex:1 1 100%;height:6px;border-radius:99px;background:var(--line);margin-top:8px;cursor:pointer;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .12s linear;}
  .dtime{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;margin-top:3px;display:flex;justify-content:space-between;}
  .hidden{display:none!important;}
  .empty{text-align:center;color:var(--sub);padding:40px;font-size:14px;}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:26px;}

  /* ===== 顶部条状播放区（新增） ===== */
  .tape{
    background:#fff;border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);
    margin:0 0 18px;border:1.5px solid var(--line);
    display:flex;flex-direction:column;   /* 纵向撑开：头部固定，网格吃掉剩余高度 */
  }
  .tape-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
  .tape-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--ink);}
  .tape-title .ic{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;}
  .tape-info{color:var(--sub);font-size:12px;}
  .tape-tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
  .tape-btn{
    border:1.5px solid var(--line);background:#fff;border-radius:999px;
    padding:7px 14px;font-size:12px;font-weight:800;color:#c23b7e;cursor:pointer;
  }
  .tape-btn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
  .tape-btn.icon{min-width:36px;padding:7px 10px;}

  .tape-row{
    display:grid;grid-template-columns:repeat(14, minmax(0,1fr));
    gap:6px;padding:4px 2px 6px;
    flex:1 1 auto;                          /* 吃掉 .tape 剩余高度 */
    grid-auto-rows:minmax(26px, 1fr);       /* 行高自适应：整体高度对齐封面 */
    align-content:stretch;
  }
  .tape-row.scroll{grid-template-columns:none;display:flex;flex-wrap:nowrap;overflow-x:auto;align-items:center;}
  .tape-row::-webkit-scrollbar{height:8px;}
  .tape-row::-webkit-scrollbar-thumb{background:var(--accent);border-radius:99px;}
  .tape-row::-webkit-scrollbar-track{background:#f4f6fb;border-radius:99px;}
  .tape-chip{
    cursor:pointer;
    background:var(--chip);color:#c23b7e;
    font-weight:800;font-size:13.5px;
    border:1.5px solid #ffe3f0;border-radius:12px;
    padding:7px 4px;display:inline-flex;align-items:center;justify-content:center;gap:4px;
    transition:all .15s ease;user-select:none;text-align:center;
    position:relative;
  }
  .tape-row.scroll .tape-chip{flex:0 0 auto;min-width:54px;padding:8px 12px;}
  .tape-chip:hover{background:#ffe0ef;}
  .tape-chip:active{transform:scale(.94);}
  .tape-chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;
    box-shadow:0 6px 14px rgba(255,126,182,.4);}
  .tape-chip .ic{font-size:10px;opacity:.85;}
  .tape-chip.on .ic{opacity:1;}
  .tape-chip .row{position:absolute;top:2px;left:4px;font-size:9px;color:#c23b7e;opacity:.45;font-weight:700;}
  .tape-now{
    display:inline-block;margin-left:6px;font-size:12px;color:#c23b7e;font-weight:700;
    background:#fff0f7;border-radius:999px;padding:2px 9px;
  }
  @media (max-width:1100px){ .tape-row{grid-template-columns:repeat(10, minmax(0,1fr));} }
  /* 窄屏（平板竖/手机）：整体紧凑一档，保证音频区仍能贴合封面高度 */
  @media (max-width:860px){
    .tape{padding:12px;}
    .tape-head{gap:8px;margin-bottom:8px;}
    .tape-btn{padding:6px 11px;font-size:11.5px;}
    .tape-btn.icon{min-width:32px;padding:6px 8px;}
    .tape-chip{padding:5px 3px;font-size:12.5px;border-radius:10px;}
    .tape-chip .row{font-size:8px;top:1px;left:3px;}
  }
  @media (max-width:560px){ .tape-row{grid-template-columns:repeat(5,  minmax(0,1fr));} }

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="../index.html">← 书架</a>
    <div class="logo">🎧</div>
    <div>
      <h1>Basic Reading 200 Key Words 2</h1>
      <div class="sub">点文件名/图片播放，再点一下暂停 · 多音轨可切换</div>
    </div>
    <div class="tools">
      <input id="search" class="search" placeholder="搜索文件名 / 页码…" />
      <button id="onlyaudio" class="togglebtn" title="隐藏没有音频的卡片">只看有音频</button>
      <span id="count" class="count"></span>
    </div>
  </header>

  <!-- 顶部条状播放区：全部音频按 Track 顺序排列 -->
  <div class="tape" id="tape">
    <div class="tape-head">
      <div class="tape-title">
        <span class="ic">▤</span>
        全部音频 <span class="tape-now" id="tapeNow">—</span>
      </div>
      <div class="tape-info" id="tapeInfo">—</div>
      <div class="tape-tools">
        <button id="tGrid" class="tape-btn on">网格</button>
        <button id="tScroll" class="tape-btn">单行横滚</button>
        <span style="width:1px;height:22px;background:var(--line);margin:0 2px"></span>
        <button id="tPrev" class="tape-btn icon" title="上一首">⏮</button>
        <button id="tNext" class="tape-btn icon" title="下一首">⏭</button>
        <button id="tRand" class="tape-btn icon" title="随机一首">🎲</button>
        <button id="tLoopOff" class="tape-btn on" title="不循环：播完就停">循环 关</button>
        <button id="tLoopOne" class="tape-btn" title="单曲循环：当前这首无限重播">单曲</button>
        <span style="width:1px;height:22px;background:var(--line);margin:0 2px"></span>
        <button id="tChain" class="tape-btn">连播 ▶</button>
        <button id="tStop" class="tape-btn">⏹ 停止</button>
      </div>
    </div>
    <div class="tape-row" id="tapeRow"></div>
  </div>

  <div id="warn" class="warn hidden">
    <b>⚠ 当前打开方式读取不到本地音频 / 图片</b>
    <div>预览面板是沙盒环境，访问不到本册文件夹 <code>Basicreading200-2/audio/</code> 里的 mp3。音频文件本身完好（共 99 个），换用下面的地址在浏览器打开即可正常播放：</div>
    <div><span id="warnurl" class="warnurl">http://127.0.0.1:8123/Basicreading200-2/Basicreading200-2.html</span></div>
    <button id="copyurl" class="copybtn">复制链接</button>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty hidden">没有匹配的文件</div>
  <footer>共 <span id="total">0</span> 个文件 · <span id="withaudio">0</span> 个含音频</footer>
</div>

<div class="dock hidden" id="dock">
  <div class="dthumb" id="dthumb"><img id="dthumbimg" alt=""></div>
  <button class="dbtn" id="dplay">▶</button>
  <div class="dinfo">
    <div class="dtitle" id="dtitle">—</div>
    <div class="dtrack" id="dtrack">—</div>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <div class="dtime"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>
</div>

<audio id="audio" preload="none"></audio>
<script src="data.js"></script>
<script>
(function(){
  var items = window.ITEMS || [];
  var grid = document.getElementById('grid');
  var audio = document.getElementById('audio');
  var dock = document.getElementById('dock');
  var dplay = document.getElementById('dplay');
  var dtitle = document.getElementById('dtitle');
  var dtrack = document.getElementById('dtrack');
  var fill = document.getElementById('fill');
  var bar = document.getElementById('bar');
  var curEl = document.getElementById('cur');
  var durEl = document.getElementById('dur');
  var dthumb = document.getElementById('dthumb');
  var dthumbimg = document.getElementById('dthumbimg');
  var search = document.getElementById('search');
  var countEl = document.getElementById('count');
  var tapeChain = false;        // 顶部条状区连播状态

  var state = { n:null, track:null }; // currently loaded

  function enc(p){ return encodeURI(p); }
  function fmt(t){ if(!isFinite(t)||t<0) t=0; var m=Math.floor(t/60), s=Math.floor(t%60); return m+":"+(s<10?"0":"")+s; }
  // 从音频文件名提取数字：Track01.mp3 -> "01"
  function audioNum(tk){
    var m = /Track(\d+)\.mp3$/i.exec(tk.src || '');
    if(!m) return '';
    var n = parseInt(m[1],10);
    return (n<10?'0':'') + n;
  }

  function buildPage(it){
    var page = document.createElement('div');
    page.className = 'page';
    page.dataset.n = it.n;
    page.dataset.search = (it.file + ' ' + it.page).toLowerCase();
    page.title = it.file; // 原文件名保留为悬停提示，便于核对

    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    var img = document.createElement('img');
    img.src = it.thumb || '';
    img.alt = it.file;
    img.loading = 'lazy';
    thumb.appendChild(img);
    var badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = (it.page!=null? ('P '+it.page) : ('#'+it.n));
    thumb.appendChild(badge);
    var wave = document.createElement('div');
    wave.className = 'wave';
    wave.innerHTML = '<i></i><i></i><i></i><i></i>';
    thumb.appendChild(wave);
    thumb.addEventListener('click', function(){ toggle(it, 0); });
    page.appendChild(thumb);

    page.dataset.hasaudio = (it.tracks && it.tracks.length) ? '1' : '0';

    // 音频区：所有卡片都渲染（统一上下 2 排 + 背景），空条目不显示按钮
    var tr = document.createElement('div');
    tr.className = 'tracks';
    var list = (it.tracks || []).filter(function(tk){ return tk && tk.src; });
    if(list.length){
      (it.tracks || []).forEach(function(tk, idx){
        if(!tk || !tk.src) return;
        var b = document.createElement('button');
        b.className = 'track' + (list.length===1 ? ' wide' : '');
        b.dataset.idx = idx;   // 保留原始索引，播放/高亮不会错位
        b.innerHTML = '<span class="ic">▶</span>' + audioNum(tk);
        b.title = (tk.src || '').split('/').pop();
        b.addEventListener('click', function(){ toggle(it, idx); });
        tr.appendChild(b);
      });
    } else {
      var gh = document.createElement('div');
      gh.className = 'track ghost';
      gh.textContent = '暂无音频';
      tr.appendChild(gh);
    }
    page.appendChild(tr);
    return page;
  }

  function escapeHtml(s){ return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function render(){
    grid.innerHTML='';
    // 对开书排序：第一行 = 封面一(001) + 封面二(080)，其后按 (2,3)(4,5)… 左右成对
    var order = items.length > 1
      ? [items[0], items[items.length-1]].concat(items.slice(1, items.length-1))
      : items;
    order.forEach(function(it){ grid.appendChild(buildPage(it)); });
    document.getElementById('total').textContent = items.length;
    document.getElementById('withaudio').textContent = items.filter(function(i){return i.tracks&&i.tracks.length;}).length;
  }
  render();

  /* ===== 顶部条状播放区 ===== */
  var tapeRow = document.getElementById('tapeRow');
  var tapeInfo = document.getElementById('tapeInfo');
  var tapeNow = document.getElementById('tapeNow');
  var tapeList = (function(){
    var seen = {}, arr = [];
    items.forEach(function(it){
      (it.tracks||[]).forEach(function(tk){
        if(!tk || !tk.src || seen[tk.src]) return;
        seen[tk.src] = 1;
        var m = /Track(\d+)/.exec(tk.src);
        arr.push({ src: tk.src, num: m?parseInt(m[1],10):0, page: it.page, n: it.n, file: it.file, item: it });
      });
    });
    arr.sort(function(a,b){ return a.num-b.num; });
    return arr;
  })();
  tapeInfo.textContent = '共 ' + tapeList.length + ' 条 · 默认 ' + Math.ceil(tapeList.length/14) + ' 行 14 列';
  tapeList.forEach(function(t, i){
    var c = document.createElement('div');
    c.className = 'tape-chip';
    c.dataset.i = i;
    c.dataset.src = encodeURI(t.src);
    var rowNo = Math.floor(i/14) + 1;   // 行号
    var pLabel = t.page != null ? 'P' + t.page : '#' + t.n;
    c.innerHTML = '<span class="row">' + pLabel + '</span><span class="ic">▶</span>' + (t.num<10?'0':'') + t.num;
    c.title = '第 ' + rowNo + ' 行 · P' + t.page + ' · ' + t.src.split('/').pop();
    c.addEventListener('click', function(){ playTape(i, c); });
    tapeRow.appendChild(c);
  });

  function findTrackIdx(it, src){
    var list = it.tracks || [];
    for(var k=0;k<list.length;k++) if(list[k] && list[k].src === src) return k;
    return 0;
  }
  function currentTapeIdx(){
    var el = document.querySelector('.tape-chip.on');
    return el ? parseInt(el.dataset.i, 10) : -1;
  }
  // 跟踪「上一次实际点/自动播放的 chip index」，让 ended → playTapeNext 不会因为 .on 被清空而跳到 0
  var lastTapeIdx = -1;
  // playTape(i, el, auto)：auto=true 时滚到 chip 可见（自动跳歌用），用户手动点 chip 不滚（避免把工具栏滚出屏幕）
  function playTape(i, el, auto){
    if(i<0 || i>=tapeList.length) return;
    lastTapeIdx = i;
    var t = tapeList[i];
    state.n = t.n; state.track = findTrackIdx(t.item, t.src);
    clearPlayingUI();
    el.classList.add('on');
    loadAndPlay(t.item, state.track);  // 复用原路径：markPlaying / dock / 进度
    if(auto){ el.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'}); }
  }
  var tapeLoop = 'off';
  function playTapeNext(){
    var i = lastTapeIdx >= 0 ? lastTapeIdx : currentTapeIdx();
    var j;
    if(tapeLoop==='one'){ j = i >= 0 ? i : 0; }  // 单曲循环：再放自己
    else if(i < 0){ j = 0; }
    else if(i+1 >= tapeList.length){ tapeNow.textContent = '已播完最后一条'; return; }
    else { j = i+1; }
    playTape(j, tapeRow.children[j], true);  // 自动跳：滚到 chip 可见
  }
  function playTapePrev(){
    var i = lastTapeIdx >= 0 ? lastTapeIdx : currentTapeIdx();
    if(i <= 0) return;
    playTape(i-1, tapeRow.children[i-1], true);
  }
  function playTapeRand(){
    if(tapeList.length<2) return;
    var cur = lastTapeIdx >= 0 ? lastTapeIdx : currentTapeIdx();
    var j;
    do { j = Math.floor(Math.random() * tapeList.length); } while(j === cur);
    playTape(j, tapeRow.children[j], true);
  }
  // 布局切换
  document.getElementById('tGrid').addEventListener('click', function(){
    tapeRow.classList.remove('scroll');
    this.classList.add('on'); document.getElementById('tScroll').classList.remove('on');
  });
  document.getElementById('tScroll').addEventListener('click', function(){
    tapeRow.classList.add('scroll');
    this.classList.add('on'); document.getElementById('tGrid').classList.remove('on');
  });
  // 上下首 / 随机
  document.getElementById('tPrev').addEventListener('click', playTapePrev);
  document.getElementById('tNext').addEventListener('click', playTapeNext);
  document.getElementById('tRand').addEventListener('click', playTapeRand);
  // 循环 关 / 单曲 与 连播：互斥单选（点谁谁亮，另一个自动灭）
  var loopBtns = {
    off: document.getElementById('tLoopOff'),
    one: document.getElementById('tLoopOne')
  };
  var chainBtn = document.getElementById('tChain');
  function setLoop(mode){
    tapeLoop = mode;
    Object.keys(loopBtns).forEach(function(k){ loopBtns[k].classList.toggle('on', k===mode); });
    if(mode==='one' && tapeChain){   // 开单曲 → 自动关连播
      tapeChain = false;
      chainBtn.classList.remove('on');
      chainBtn.textContent = '连播 ▶';
    }
  }
  function setChain(on){
    if(!on){
      tapeChain = false;
      chainBtn.classList.remove('on');
      chainBtn.textContent = '连播 ▶';
      return;
    }
    tapeChain = true;
    chainBtn.classList.add('on');
    chainBtn.textContent = '连播中 ●';
    if(tapeLoop!=='off') setLoop('off');   // 开连播 → 自动把单曲切回「循环 关」
  }
  loopBtns.off.addEventListener('click', function(){ setLoop('off'); });
  loopBtns.one.addEventListener('click', function(){ setLoop('one'); });
  chainBtn.addEventListener('click', function(){ setChain(!tapeChain); });
  setLoop('off');
  document.getElementById('tStop').addEventListener('click', function(){
    audio.pause(); audio.currentTime = 0;
    setChain(false);
    lastTapeIdx = -1;
    clearPlayingUI(); tapeNow.textContent = '已停止';
  });

  function clearPlayingUI(){
    document.querySelectorAll('.page.playing').forEach(function(c){ c.classList.remove('playing'); });
    document.querySelectorAll('.track.on').forEach(function(b){ b.classList.remove('on'); b.querySelector('.ic').textContent='▶'; });
    document.querySelectorAll('.tape-chip.on').forEach(function(b){ b.classList.remove('on'); });
  }

  function toggle(it, idx){
    if(!it.tracks || !it.tracks[idx]){
      dock.classList.remove('hidden');
      dtitle.textContent = it.file;
      dtrack.textContent = '该卡片暂无音频';
      return;
    }
    if(state.n===it.n && state.track===idx && !audio.paused){ audio.pause(); return; }
    loadAndPlay(it, idx);
  }

  function loadAndPlay(it, idx){
    clearPlayingUI();
    state.n = it.n; state.track = idx;
    var tk = it.tracks[idx];
    audio.src = enc(tk.src);
    audio.play().then(function(){ markPlaying(it, idx); }).catch(function(e){
      // 浏览器自动播放策略拦截时，提示用户手动点一次
      dtrack.textContent = '请点底部 ▶ 开始播放';
      console.warn('play blocked by autoplay policy', e);
    });
    markPlaying(it, idx);
    showDock(it, tk);
  }

  function markPlaying(it, idx){
    var page = document.querySelector('.page[data-n="'+it.n+'"]');
    if(page){ page.classList.add('playing'); }
    if(page){
      var b = page.querySelector('.track[data-idx="'+idx+'"]');
      if(b){ b.classList.add('on'); b.querySelector('.ic').textContent='⏸'; }
    }
    // 同步点亮顶部条状区对应 chip
    var tk = (it.tracks||[])[idx];
    if(tk && tk.src){
      document.querySelectorAll('.tape-chip').forEach(function(ch){
        ch.classList.toggle('on', ch.dataset.src === encodeURI(tk.src));
      });
    }
  }

  function showDock(it, tk){
    dock.classList.remove('hidden');
    dtitle.textContent = it.file;
    dtrack.textContent = '音轨 ' + audioNum(tk) + (it.tracks.length>1?(' / 共'+it.tracks.length):'');
    if(it.thumb){ dthumb.classList.add('show'); dthumbimg.src = it.thumb; } else { dthumb.classList.remove('show'); }
  }

  dplay.addEventListener('click', function(){
    if(!audio.src){ return; }
    if(audio.paused){ audio.play(); } else { audio.pause(); }
  });

  audio.addEventListener('play', function(){ dplay.textContent='⏸'; });
  audio.addEventListener('pause', function(){
    dplay.textContent='▶';
    var page = document.querySelector('.page[data-n="'+state.n+'"]');
    if(page){ var b=page.querySelector('.track.on'); if(b) b.querySelector('.ic').textContent='▶'; }
  });
  audio.addEventListener('ended', function(){
    dplay.textContent='▶'; clearPlayingUI(); fill.style.width='0%'; curEl.textContent='0:00';
    // 单曲循环 / 连播：自动继续往下放
    if(typeof tapeLoop!=='undefined' && tapeLoop && tapeLoop!=='off'){
      playTapeNext();
    } else if(typeof tapeChain!=='undefined' && tapeChain){
      playTapeNext();
    }
  });
  audio.addEventListener('timeupdate', function(){
    if(audio.duration){ fill.style.width = (audio.currentTime/audio.duration*100)+'%'; }
    curEl.textContent = fmt(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', function(){ durEl.textContent = fmt(audio.duration); });
  audio.addEventListener('error', function(){
    var raw = audio.currentSrc || audio.src || '';
    var name = decodeURIComponent(raw.split('/').pop() || '');
    dtrack.innerHTML = '⚠ 加载失败：' + escapeHtml(name || raw) + ' 读取不到';
    showWarn(); // 大概率是打开方式问题，给出指引
    console.error('audio error', raw, audio.error);
  });

  /* ---------- 环境检测：能否读到本地音频 ---------- */
  var warnEl = document.getElementById('warn');
  var warned = false;
  function showWarn(){
    if(warned) return;
    warned = true;
    warnEl.classList.remove('hidden');
  }
  function probeAudio(){
    var probeSrc = null;
    for(var i=0;i<items.length;i++){
      if(items[i].tracks && items[i].tracks[0]){ probeSrc = items[i].tracks[0].src; break; }
    }
    if(!probeSrc) return;
    var a = new Audio();
    a.preload = 'metadata';
    a.onerror = function(){ showWarn(); };
    a.src = enc(probeSrc);
    // 兜底：若 6 秒内既没加载成功也没报错，多半是路径不可达
    setTimeout(function(){ if(a.readyState===0) showWarn(); }, 6000);
  }
  probeAudio();

  var copyBtn = document.getElementById('copyurl');
  copyBtn.addEventListener('click', function(){
    var url = document.getElementById('warnurl').textContent;
    try{
      navigator.clipboard.writeText(url);
      copyBtn.textContent = '已复制 ✓';
    }catch(e){
      copyBtn.textContent = '请手动复制：' + url;
    }
    setTimeout(function(){ copyBtn.textContent = '复制链接'; }, 2000);
  });

  bar.addEventListener('click', function(e){
    if(!audio.duration) return;
    var r = bar.getBoundingClientRect();
    audio.currentTime = (e.clientX - r.left)/r.width * audio.duration;
  });

  var onlyaudio=false;
  var oaBtn = document.getElementById('onlyaudio');
  function applyFilter(){
    var q = search.value.trim().toLowerCase();
    var shown=0;
    document.querySelectorAll('.page').forEach(function(c){
      var ok = (!q || c.dataset.search.indexOf(q)>=0) && (!onlyaudio || c.dataset.hasaudio==='1');
      c.style.display = ok ? '' : 'none';
      if(ok) shown++;
    });
    document.getElementById('empty').classList.toggle('hidden', shown>0);
    countEl.textContent = (q||onlyaudio) ? (shown+' / '+items.length) : '';
    syncTapeHeight();   // 可见卡片变了，重新对齐音频区高度
  }
  search.addEventListener('input', applyFilter);
  oaBtn.addEventListener('click', function(){
    onlyaudio = !onlyaudio;
    oaBtn.classList.toggle('on', onlyaudio);
    applyFilter();
  });
  /* ===== 让「全部音频」外框高度 = 封面卡片高度（随视口/列数自动重算） ===== */
  var tapeEl = document.getElementById('tape');
  function syncTapeHeight(){
    if(!tapeEl) return;
    var cards = document.querySelectorAll('.grid .page'), h = 0;
    for(var k=0; k<cards.length; k++){          // 取第一张「可见」卡片
      if(cards[k].style.display === 'none') continue;
      h = cards[k].getBoundingClientRect().height;
      break;
    }
    tapeEl.style.minHeight = h > 0 ? Math.round(h) + 'px' : '';
  }
  syncTapeHeight();
  var rtTape;
  window.addEventListener('resize', function(){ clearTimeout(rtTape); rtTape = setTimeout(syncTapeHeight, 120); });
  window.addEventListener('orientationchange', function(){ setTimeout(syncTapeHeight, 200); });
  window.addEventListener('load', syncTapeHeight);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(syncTapeHeight); }
})();
</script>
</body>
</html>
