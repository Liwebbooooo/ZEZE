<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>汉字阅读扩展</title>
<style>
  :root{
    --bg1:#fff7ec; --bg2:#f0f7ff; --bg3:#fff0f5;
    --ink:#2b2f44; --sub:#7a8098;
    --accent:#ff8a3d; --accent2:#e65c8a;
    --line:#f0e6d8; --shadow:0 10px 30px rgba(180,120,60,.10);
    --fs-body:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);font-size:var(--fs-body);
    background:
      radial-gradient(900px 500px at 8% -8%, var(--bg1), transparent 60%),
      radial-gradient(900px 500px at 110% 0%, var(--bg2), transparent 55%),
      linear-gradient(180deg, var(--bg3), #ffffff 60%);
    min-height:100vh;padding:22px 16px 60px;line-height:1.85;
  }
  .wrap{max-width:920px;margin:0 auto;}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .back{
    flex:0 0 auto;text-decoration:none;color:#c75a26;background:#fff;
    border:2px solid var(--line);border-radius:999px;padding:11px 20px;
    font-size:15px;font-weight:800;transition:all .15s;
  }
  .back:hover{border-color:#ff8a3d;box-shadow:0 4px 12px rgba(255,138,61,.18);}
  .meta{font-size:14px;color:var(--sub);}
  .pager{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .pager a{
    text-decoration:none;color:#c75a26;background:#fff;border:2px solid var(--line);
    border-radius:999px;padding:9px 16px;font-size:14px;font-weight:800;transition:all .15s;
  }
  .pager a:hover{border-color:#ff8a3d;}
  .pager a.disabled{opacity:.4;pointer-events:none;}
  .pager .idx{font-size:14px;color:var(--sub);font-weight:700;}

  .hero{
    background:#fff;border-radius:26px;padding:38px 32px 30px;box-shadow:var(--shadow);
    text-align:center;margin-bottom:20px;border:2px solid #ffe2c9;
    background:linear-gradient(180deg,#fffaf2,#ffffff 80%);
  }
  .hanzi{
    font-family:"KaiTi","STKaiti","楷体",serif;
    font-size:clamp(120px, 26vh, 220px);line-height:1;font-weight:700;color:#222;
    background:linear-gradient(180deg,#ff7e3d,#e6558a);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;letter-spacing:10px;
    margin:6px 0 10px;cursor:pointer;display:inline-block;transition:transform .2s;
  }
  .hanzi:hover{transform:scale(1.04);}
  .pinyin{font-size:28px;color:#c75a26;font-weight:600;letter-spacing:6px;margin-bottom:6px;}
  .badge{
    display:inline-block;background:#fff0e0;color:#c75a26;border-radius:999px;
    padding:5px 16px;font-size:14px;font-weight:700;margin-top:8px;
  }
  .ttsrow{margin-top:18px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .ttsbtn{
    border:2px solid #ffd9b8;background:#fff;border-radius:999px;padding:11px 22px;
    font-size:15px;font-weight:800;color:#c75a26;cursor:pointer;transition:all .15s;
  }
  .ttsbtn:hover{background:#fff7ec;}
  .ttsbtn.on{background:linear-gradient(135deg,#ff8a3d,#e65c8a);color:#fff;border-color:transparent;}

  .sec{background:#fff;border-radius:22px;padding:24px 28px;box-shadow:var(--shadow);margin-bottom:20px;}
  .sec h2{
    font-size:20px;margin:0 0 16px;display:flex;align-items:center;gap:10px;
    color:#c75a26;font-weight:800;
  }
  .sec h2 .ic{
    width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#ff8a3d,#e65c8a);color:#fff;font-size:15px;font-weight:800;
  }

  .item{
    display:grid;grid-template-columns:100px 1fr;gap:16px;align-items:start;
    padding:14px 0;border-top:1.5px dashed #f0e6d8;
  }
  .item:first-of-type{border-top:0;}
  .word{
    font-size:20px;font-weight:800;color:#c75a26;
    background:#fff7ec;border-radius:14px;padding:10px 8px;text-align:center;line-height:1.3;
    cursor:pointer;transition:background .15s;
  }
  .word:hover{background:#ffe9d4;}
  .desc{font-size:17px;color:#444;line-height:1.85;}

  .idiom{
    background:linear-gradient(135deg,#fff7ec,#fff0f5);
    border-radius:16px;padding:16px 20px;margin-bottom:12px;border:1.5px solid #ffe2c9;
  }
  .idiom:last-child{margin-bottom:0;}
  .idiom .it{font-size:22px;font-weight:800;color:#c4337a;margin-bottom:6px;cursor:pointer;}
  .idiom .it:hover{color:#9b2660;}
  .idiom .ex{font-size:16px;color:#555;line-height:1.8;}

  .story-title{
    font-family:"KaiTi","STKaiti","楷体",serif;
    font-size:26px;color:#c4337a;font-weight:700;text-align:center;
    margin:0 0 14px;letter-spacing:3px;
  }
  .story p{font-size:18px;line-height:2.15;color:#333;text-indent:2em;margin:0 0 8px;}
  .story .tag{
    display:inline-block;background:#fff0e0;color:#c75a26;border-radius:999px;
    padding:4px 14px;font-size:13px;font-weight:700;margin:12px 0 6px;
  }
  .empty{padding:60px 0;text-align:center;color:#c75a26;font-size:18px;}

  footer{text-align:center;color:var(--sub);font-size:13px;margin-top:24px;}

  @media (max-width: 720px){
    :root{ --fs-body:16px; }
    .wrap{max-width:100%;}
    .hero{padding:24px 18px 22px;}
    .hanzi{font-size:140px;letter-spacing:6px;}
    .pinyin{font-size:22px;}
    .item{grid-template-columns:84px 1fr;gap:12px;}
    .word{font-size:18px;}
    .desc{font-size:15px;}
    .idiom .it{font-size:20px;}
    .idiom .ex{font-size:14px;}
    .story p{font-size:16px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="../index.html">← 书架</a>
    <span class="meta" id="meta">部编版小学语文</span>
    <div class="pager">
      <a id="prev" href="#">‹ 上一字</a>
      <span class="idx" id="idx">—</span>
      <a id="next" href="#">下一字 ›</a>
    </div>
  </div>

  <div id="content"></div>

  <footer>用「字 → 词 → 语 → 事」四步法，每天认识一个汉字</footer>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var n = parseInt(params.get('n') || '1', 10);
  var jsonFile = (n + '').padStart(3, '0') + '.json';
  var backHref = document.querySelector('.back');

  // 加载对应 JSON（脚本式注入 → window.DATA）
  var s = document.createElement('script');
  s.src = jsonFile;
  s.onerror = function(){
    document.getElementById('content').innerHTML =
      '<div class="empty">找不到 <code>' + jsonFile + '</code>，请确认文件存在</div>';
  };
  s.onload = function(){ render(); };
  document.body.appendChild(s);

  window.render = function(){
    var D = window.DATA;
    if(!D || !D.字){
      document.getElementById('content').innerHTML =
        '<div class="empty">数据格式错误：' + jsonFile + '</div>';
      return;
    }
    document.title = D.字 + ' · 阅读扩展';
    document.getElementById('meta').textContent =
      '部编版小学语文 · ' + D.学期 + ' · 第 ' + D.序号 + ' 字';
    document.getElementById('idx').textContent = '#' + D.序号;
    var num = D.序号;
    var prev = document.getElementById('prev');
    var next = document.getElementById('next');
    prev.href = '?n=' + (num - 1);
    next.href = '?n=' + (num + 1);
    if(num <= 1) prev.classList.add('disabled');

    var html = '';
    // Hero
    html += '<div class="hero">'
          +   '<div class="pinyin">' + D.拼音 + '</div>'
          +   '<div class="hanzi" id="hanzi" title="点击朗读">' + D.字 + '</div>'
          +   '<div class="badge">' + D.学期 + ' · 序号 ' + num + '</div>'
          +   '<div class="ttsrow">'
          +     '<button class="ttsbtn" data-say="hanzi">朗读字</button>'
          +     '<button class="ttsbtn" data-say="pinyin">读拼音</button>'
          +     '<button class="ttsbtn" data-say="all">朗读全部</button>'
          +   '</div>'
          + '</div>';
    // 词语
    html += '<div class="sec"><h2><span class="ic">词</span>词语解释</h2>';
    (D.词语||[]).forEach(function(w){
      html += '<div class="item">'
            +   '<div class="word" data-say="' + esc(w.词) + '">' + w.词 + '</div>'
            +   '<div class="desc">' + w.解释 + '</div>'
            + '</div>';
    });
    html += '</div>';
    // 成语
    html += '<div class="sec"><h2><span class="ic">语</span>成语扩展</h2>';
    (D.成语||[]).forEach(function(it){
      html += '<div class="idiom">'
            +   '<div class="it" data-say="' + esc(it.词+'，'+it.解释) + '">' + it.词 + '</div>'
            +   '<div class="ex">释义：' + it.解释 + '</div>'
            + '</div>';
    });
    html += '</div>';
    // 故事
    html += '<div class="sec story"><h2><span class="ic">事</span>故事时光</h2>'
          +   '<div class="story-title">' + D.故事.标题 + '</div>'
          +   '<div class="tag">取材 · ' + (D.故事.取材 || '历史人物') + '</div>';
    (D.故事.原文||[]).forEach(function(p){
      html += '<p>' + p + '</p>';
    });
    html += '</div>';

    document.getElementById('content').innerHTML = html;
    bindTTS();
  };

  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function bindTTS(){
    var D = window.DATA;
    function speak(text, btn){
      try{ window.speechSynthesis.cancel(); }catch(e){}
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.05;
      if(btn){
        document.querySelectorAll('.ttsbtn.on,.word.on,.it.on').forEach(function(b){b.classList.remove('on');});
        btn.classList.add('on');
      }
      u.onend = function(){ if(btn) btn.classList.remove('on'); };
      window.speechSynthesis.speak(u);
    }
    document.querySelectorAll('.ttsbtn').forEach(function(b){
      b.addEventListener('click', function(){
        var t = b.dataset.say;
        if(t==='hanzi') speak(D.字, b);
        else if(t==='pinyin') speak(D.拼音, b);
        else if(t==='all'){
          var full = D.字 + '。' + (D.词语||[]).map(function(w){return w.词+'，'+w.解释;}).join('。')
                   + '。' + (D.成语||[]).map(function(c){return c.词+'，'+c.解释;}).join('。')
                   + '。' + D.故事.标题 + '。' + (D.故事.原文||[]).join('。');
          speak(full, b);
        }
      });
    });
    var hz = document.getElementById('hanzi');
    if(hz) hz.addEventListener('click', function(){ speak(D.字, hz); });
    document.querySelectorAll('.word[data-say],.it[data-say]').forEach(function(el){
      el.addEventListener('click', function(){ speak(el.dataset.say, el); });
    });
  }
})();
</script>
</body>
</html>
